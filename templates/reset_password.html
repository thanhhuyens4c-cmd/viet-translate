{% extends "base.html" %}
{% block title %}Đặt lại mật khẩu - VietTranslate{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden bg-slate-50">
    <div class="absolute inset-0 z-0">
        <div class="absolute inset-y-0 w-full h-full bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] [background-size:16px_16px] opacity-50"></div>
    </div>

    <div class="max-w-md w-full space-y-6 bg-white/80 backdrop-blur-xl p-8 sm:p-10 rounded-3xl shadow-2xl shadow-slate-200/50 relative z-10 border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Đặt lại mật khẩu</h1>
            <p class="text-xs text-slate-500 mt-2">Vui lòng nhập mật khẩu mới (ít nhất 6 ký tự).</p>
        </div>
        
        <form method="POST" action="{{ url_for('reset_password', token=token, email=email) }}" class="space-y-4">
            <div>
                <label class="block text-slate-700 font-bold mb-1.5 text-xs uppercase tracking-wider">Mật khẩu mới</label>
                <div class="relative">
                    <input type="password" id="new_password" name="new_password" required minlength="6"
                           class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 text-xs sm:text-sm bg-slate-50/50 pr-10"
                           autocomplete="new-password">
                </div>
            </div>
            
            <div>
                <label class="block text-slate-700 font-bold mb-1.5 text-xs uppercase tracking-wider">Xác nhận mật khẩu</label>
                <div class="relative">
                    <input type="password" id="confirm_password" name="confirm_password" required minlength="6"
                           class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 text-xs sm:text-sm bg-slate-50/50 pr-10"
                           autocomplete="new-password">
                </div>
            </div>
            
            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-xl transition shadow-sm text-xs sm:text-sm mt-4">
                Xác Nhận Đổi Mật Khẩu
            </button>
        </form>
        
        <div class="text-center mt-6">
            <a href="{{ url_for('login') }}" class="text-xs text-brand-600 hover:text-brand-700 font-semibold flex justify-center items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Quay lại đăng nhập
            </a>
        </div>
    </div>
</div>
{% endblock %}
