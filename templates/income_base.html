{% extends "base.html" %}

{% block title %}{% block income_title %}Thu nhập{% endblock %} | VietTranslate{% endblock %}

{% block content %}
<div class="bg-slate-50/60 min-h-screen py-8 sm:py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Breadcrumb / Header bar -->
        <div class="flex items-center gap-2 text-xs sm:text-sm text-slate-500 mb-6">
            <a href="{{ url_for('index') }}" class="hover:text-brand-600 transition flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Trang chủ
            </a>
            <span>/</span>
            <span class="text-slate-400">Phiên dịch viên</span>
            <span>/</span>
            <span class="font-semibold text-brand-600">Thu nhập</span>
            {% block income_breadcrumb_sub %}{% endblock %}
        </div>

        <!-- Main Content Area (Full width) -->
        <div class="w-full space-y-6">
            {% block income_content %}{% endblock %}
        </div>
    </div>
</div>
{% endblock %}
